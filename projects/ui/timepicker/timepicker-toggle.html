<button
  type="button"
  [attr.aria-label]="_intl.openClockLabel"
  [attr.aria-haspopup]="'dialog'"
  [attr.aria-expanded]="for().isOpen()"
  [class]="_buttonClass"
  [disabled]="isDisabled()"
  (click)="_toggle()"
>
  <!-- Project custom icon content to replace the default clock icon. -->
  <!-- The rule doesn't know about `ng-content` fallback content yet. -->
  <!-- eslint-disable @angular-eslint/template/prefer-self-closing-tags -->
  <ng-content>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="size-4"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10" />
      <polyline points="12 6 12 12 16 14" />
    </svg>
  </ng-content>
  <!-- eslint-enable @angular-eslint/template/prefer-self-closing-tags -->
</button>
